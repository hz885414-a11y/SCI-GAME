<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/src/assets/fw-worklight-logo.png" />
    <link rel="apple-touch-icon" href="/src/assets/fw-worklight-logo.png" />
    <link rel="preload" as="image" href="/src/assets/main-title.webp" type="image/webp" fetchpriority="high" />
    <title>Brave Light Squad</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      document.addEventListener("click", (event) => {
        const link = event.target.closest("a");
        if (location.pathname === "/admin" && link?.textContent?.trim() === "返回遊戲") {
          event.preventDefault();
          window.open(link.href, "_blank", "noopener");
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
